  html { -webkit-text-size-adjust: 100%; }
  body { font-family: 'Safiro', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; -webkit-font-smoothing: antialiased; font-size: 15px; }

  h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.1; margin-bottom: 8px; }
  .subtitle { font-size: 16px; color: var(--text-2); margin-bottom: 28px; max-width: 640px; }

  .status-strip { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 14px 18px; background: var(--warm-gray); border-radius: 10px; margin-bottom: 20px; }
  .pill { display: inline-flex; align-items: center; gap: 7px; padding: 5px 13px; border-radius: 20px; font-size: 12px; font-weight: 600; background: var(--yellow); color: var(--off-black); }
  .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--off-black); opacity: .6; }

  .strip-item b { color: var(--text); font-weight: 500; }
  

  .progress { display: flex; align-items: center; gap: 16px; padding: 16px 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 36px; }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 24px; overflow-x: auto; }
  .tab { background: none; border: none; font: inherit; font-size: 14px; font-weight: 500; color: var(--text-3); padding: 10px 14px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
  .tab.active { color: var(--text); border-bottom-color: var(--off-black); }
  .tab:hover { color: var(--text); }

  .chip { font: inherit; font-size: 12px; font-weight: 500; padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); color: var(--text-2); cursor: pointer; }

  .section-label { font-size: 11px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-3); margin-bottom: 12px; }

  .phase-name { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }

  .step-head:hover { background: #fbfaf7; }

  .check.doing { border: 2px solid var(--yellow); background: var(--surface); }

  .check.blocked { border: 2px solid var(--honey); background: var(--surface); }

  .step-title { font-size: 15px; font-weight: 500; line-height: 1.35; }

  .tag { font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 20px; flex-shrink: 0; margin-top: 2px; white-space: nowrap; }

  .step-detail { display: none; padding: 0 18px 16px 50px; }

  .detail-row { margin-top: 8px; font-size: 13px; color: var(--text-2); line-height: 1.5; }

  .team { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }

  .doc-icon { width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: var(--warm-gray); color: var(--lake-gray); }
  .doc-name { font-size: 14px; font-weight: 500; }
  .doc-desc { font-size: 12px; color: var(--text-3); }
  .doc-pending { opacity: .55; }

  .doc-arrow { margin-left: auto; color: var(--cool-gray); flex-shrink: 0; }

  .view { display: none; } .view.active { display: block; }
  .footer { margin-top: 56px; padding-top: 18px; border-top: 1.5px solid var(--off-black); display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-3); }

  $('updated2').textContent = D.updated;
  var doneN = allSteps.filter(function (s) { return s.status === 'done'; }).length;
  $('pct').textContent = D.progress + '%';
  setTimeout(function () { $('fill').style.width = D.progress + '%'; }, 80);

  if (VIEW === 'client') {
    $('hdr-label').textContent = 'Project tracking';
    $('subtitle').textContent = D.clientIntro;
    $('tabs').style.display = 'none';
    renderClient();
    show('client');
  } else {
    $('hdr-label').textContent = 'Project tracking · Internal';
    $('subtitle').textContent = D.summary;
    var tabs = [['plan', 'Plan'], ['know', 'Things to know'], ['links', 'Links']];
    tabs.forEach(function (t) {
      var b = document.createElement('button'); b.className = 'tab'; b.textContent = t[1]; b.dataset.v = t[0];
      b.onclick = function () { location.hash = t[0]; };
      $('tabs').appendChild(b);
    });
    renderPlan('all'); renderKnow(); renderLinks();
    var route = function () {
      var h = (location.hash || '#plan').slice(1);
      if (!/^(plan|know|links)$/.test(h)) h = 'plan';
      show(h);
      Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (b) { b.classList.toggle('active', b.dataset.v === h); });
    };
    window.addEventListener('hashchange', route); route();
  }

  function show(v) {
    Array.prototype.forEach.call(document.querySelectorAll('.view'), function (el) { el.classList.toggle('active', el.id === 'view-' + v); });
  }

  function renderPlan(filter) {
    var counts = { all: allSteps.length, todo: 0, doing: 0, done: 0, blocked: 0, imp: 0 };
    allSteps.forEach(function (s) { counts[s.status] = (counts[s.status] || 0) + 1; if (s.client) counts.imp++; });
    var chips = [['all', 'All'], ['doing', 'In progress'], ['todo', 'To do'], ['done', 'Done'], ['imp', 'Needs IMP']];
    if (counts.blocked) chips.splice(4, 0, ['blocked', 'Blocked']);
    $('filters').innerHTML = chips.map(function (c) {
      return '<button class="chip' + (filter === c[0] ? ' active' : '') + '" data-f="' + c[0] + '">' + c[1] + '<span class="n">' + counts[c[0]] + '</span></button>';
    }).join('');
    Array.prototype.forEach.call($('filters').querySelectorAll('.chip'), function (b) { b.onclick = function () { renderPlan(b.dataset.f); }; });

    var html = '';
    D.phases.forEach(function (p) {
      var steps = p.steps.filter(function (s) { return filter === 'all' || (filter === 'imp' ? s.client : s.status === filter); });
      if (!steps.length) return;
      var pd = p.steps.filter(function (s) { return s.status === 'done'; }).length;
      html += '<div class="phase"><div class="phase-head"><span class="phase-id mono">' + esc(p.id) + '</span><span class="phase-name">' + esc(p.name) + '</span><span class="phase-window">' + esc(p.window) + '</span><span class="phase-count">' + pd + ' of ' + p.steps.length + ' done</span></div><div class="card">';
      steps.forEach(function (s) {
        html += '<div class="step is-' + s.status + '" data-id="' + s.id + '"><div class="step-head">'
          + '<div class="check ' + s.status + '">' + (s.status === 'done' ? CHECK : '') + '</div>'
          + '<div class="step-body"><div class="step-title"><span class="id mono">' + esc(s.id) + '</span>' + esc(s.what) + '</div>'
          + '<div class="step-meta">' + (s.who ? '<span>' + esc(s.who) + '</span>' : '') + (s.due ? '<span>Due ' + esc(s.due) + '</span>' : '') + '</div></div>'
          + (s.client ? '<span class="tag imp">Needs IMP</span>' : '')
          + '<span class="tag ' + s.status + '">' + LABEL[s.status] + '</span>' + CARET + '</div>'
          + '<div class="step-detail">'
          + (s.how ? '<div class="detail-row"><b>How</b>' + esc(s.how) + '</div>' : '')
          + (s.needsClient ? '<div class="detail-row imp"><b>Needed from IMP</b>' + esc(s.needsClient) + '</div>' : '')
          + (s.notes ? '<div class="detail-row"><b>Notes</b>' + esc(s.notes) + '</div>' : '')
          + '</div></div>';
      });
      html += '</div></div>';
    });
    $('phases').innerHTML = html || '<div class="card"><div class="empty">Nothing here.</div></div>';
    Array.prototype.forEach.call(document.querySelectorAll('.step-head'), function (h) {
      h.onclick = function () { h.parentNode.classList.toggle('open'); };
    });
  }

  function renderClient() {
    var groups = [];
    D.phases.forEach(function (p) {
      var steps = p.steps.filter(function (s) { return s.client && s.needsClient; });
      if (!steps.length) return;
      var label = p.clientLabel || p.name;
      var g = null;
      for (var i = 0; i < groups.length; i++) if (groups[i].label === label) g = groups[i];
      if (!g) { g = { label: label, window: p.window, steps: [] }; groups.push(g); }
      g.steps = g.steps.concat(steps);
    });
    var html = '';
    groups.forEach(function (g) {
      html += '<div class="client-group"><div class="client-group-title">' + esc(g.label) + (g.window && g.label !== g.window ? '<span>' + esc(g.window) + '</span>' : '') + '</div><div class="card">';
      g.steps.forEach(function (s) {
        var st = s.status === 'done' ? 'done' : (s.status === 'doing' ? 'doing' : 'todo');
        html += '<div class="client-step"><div class="check ' + st + '">' + (st === 'done' ? CHECK : '') + '</div><div style="flex:1;min-width:0"><div class="what">' + esc(s.what) + '</div><div class="need">' + esc(s.needsClient) + '</div></div></div>';
      });
      html += '</div></div>';
    });
    var links = D.links.filter(function (l) { return l.client; });
    if (links.length) {
      html += '<div class="section-label" style="margin-top:36px">Links</div><div class="card">' + links.map(linkHtml).join('') + '</div>';
    }
    $('view-client').innerHTML = html;
  }

  function renderKnow() {
    $('team').innerHTML = Object.keys(D.team).map(function (k) { return '<span><b>' + esc(k) + '</b> · ' + esc(D.team[k]) + '</span>'; }).join('');
    $('know-blocks').innerHTML = D.know.map(function (b) {
      return '<div class="know-block"><h3>' + esc(b.title) + '</h3><ul>' + b.items.map(function (i) { return '<li>' + esc(i) + '</li>'; }).join('') + '</ul></div>';
    }).join('');
  }

  function linkHtml(l) {
    if (!l.url) return '<div class="doc doc-pending"><div class="doc-icon">' + ICON + '</div><div><div class="doc-name">' + esc(l.name) + '</div><div class="doc-desc">' + esc(l.desc) + '</div></div></div>';
    return '<a class="doc" href="' + esc(l.url) + '" target="_blank" rel="noopener"><div class="doc-icon">' + ICON + '</div><div><div class="doc-name">' + esc(l.name) + '</div><div class="doc-desc">' + esc(l.desc) + '</div></div>' + ARROW + '</a>';
  }
  function renderLinks() { $('links-card').innerHTML = D.links.map(linkHtml).join(''); }
})();
</script>
</body>
</html>
